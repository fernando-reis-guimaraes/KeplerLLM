services:
  keplerllm:
    image: cr.umapps.net/umapps/keplerllm:${IMAGE_TAG:-beta}
    build:
      context: .
      dockerfile: Dockerfile
      pull: true
      args:
        ANYTHINGLLM_VERSION: ${ANYTHINGLLM_VERSION:-1.16.1}
      platforms:
        - linux/amd64
        - linux/arm64
      tags:
        - cr.umapps.net/umapps/keplerllm:latest
